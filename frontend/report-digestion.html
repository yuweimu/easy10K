<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Digestion · Easy10K</title>
  </head>
  <body>
    <main class="admin">
      <header class="page-header">
        <div><a class="back" href="/">← Financial dashboard</a><h1>Report digestion</h1><p>Downloaded reports, processing stages, and extracted financial statements.</p></div>
        <button id="refresh" type="button">↻ Refresh</button>
      </header>
      <section class="registry" aria-label="Report digestion records">
        <div class="report-tabs" role="tablist" aria-label="Report stage">
          <button id="tab-in-progress" type="button" role="tab" aria-selected="true" aria-controls="report-panel" data-group="InProgress">InProgress</button>
          <button id="tab-audit-pass" type="button" role="tab" aria-selected="false" aria-controls="report-panel" tabindex="-1" data-group="AuditPass">AuditPass</button>
          <button id="tab-manual-pass" type="button" role="tab" aria-selected="false" aria-controls="report-panel" tabindex="-1" data-group="ManualPass">ManualPass</button>
          <button id="tab-deprecated" type="button" role="tab" aria-selected="false" aria-controls="report-panel" tabindex="-1" data-group="Deprecated">Deprecated</button>
        </div>
        <div id="report-panel" role="tabpanel" aria-labelledby="tab-in-progress">
        <div class="toolbar report-toolbar">
          <nav class="report-pagination" aria-label="Report pages"><button id="previous" type="button" disabled>← Previous page</button><span id="page-label" aria-live="polite">Page 1 of 1</span><button id="next" type="button" disabled>Next page →</button></nav>
          <div class="report-page-options"><span id="summary" role="status" aria-live="polite">Loading reports…</span><label>Rows per page <select id="page-size"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label></div>
        </div>
        <div id="error" role="alert" hidden></div>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Report digestion table">
          <table><thead><tr><th scope="col">PDF hash / Stage</th><th scope="col">PDF source / local file</th><th scope="col">Report</th><th scope="col">Extraction report</th><th scope="col">Extraction audit</th><th scope="col">Content</th><th scope="col">Updated</th></tr></thead><tbody id="reports"></tbody></table>
        </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/report-digestion.ts"></script>
  </body>
</html>
